name: expense_tracker
description: Money tracker 

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+139

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.0.3
  sqflite: ^2.4.2
  path: ^1.9.1
  fl_chart: ^1.1.1
  collection: ^1.19.1
  salomon_bottom_bar: ^3.3.2
  flutter_slidable: ^4.0.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^20.0.0
  flutter_timezone: ^5.0.1
  in_app_review: ^2.0.11
  app_settings: ^6.1.1
  home_widget: ^0.8.1
  timezone: ^0.10.1
  vector_graphics: ^1.1.20
  equatable: ^2.0.7
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  firebase_core: ^3.11.0
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.3.10
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  archive: ^4.0.2
  uuid: ^4.5.3
  meta: ^1.17.0
  
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  vector_graphics_compiler: ^1.2.0

flutter_native_splash:
  color: '#000C33'
  image: 'assets/icon/AppIcon.png'

flutter:
  generate: true # Enables generation of localized strings from arb files
  uses-material-design: true

  assets:
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
    - path: assets/flags/
      transformers:
        - package: vector_graphics_compiler
    - path:  assets/logo/
      transformers:
        - package: vector_graphics_compiler
    - assets/icon/
    - lib/configuration/

  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-L.ttf
          weight: 300
        - asset: assets/fonts/Ubuntu-LI.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Ubuntu-R.ttf
          weight: 400
        - asset: assets/fonts/Ubuntu-RI.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Ubuntu-M.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-MI.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Ubuntu-B.ttf
          weight: 700
        - asset: assets/fonts/Ubuntu-BI.ttf
          weight: 700
          style: italic
        
       